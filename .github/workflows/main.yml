name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["codex/17-28-42"] # 작업 중인 브랜치 이름 확인!
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node.js 설정 (메모리 넉넉한 환경)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 의존성 설치
      - name: Install Dependencies
        run: npm install

      # 빌드 실행 (GitHub 서버의 7GB 램을 사용하므로 OOM 걱정 없음)
      - name: Build Next.js App
        run: npm run build:cf
        env:
          # 리눅스 환경에 맞는 메모리 옵션 설정
          NODE_OPTIONS: "--max_old_space_size=6144"

      # 배포 디렉터리(.open-next)에 Pages가 기대하는 워커/라우트 파일을 배치
      - name: Prepare Pages publish directory
        run: |
          mkdir -p .open-next
          # 워커 산출물을 탐색해서 _worker.js 로 복사
          WORKER_SRC=""
          if [ -f .open-next/_worker.js ]; then
            WORKER_SRC=".open-next/_worker.js"
          elif [ -f .open-next/worker.js ]; then
            WORKER_SRC=".open-next/worker.js"
          else
            WORKER_SRC="$(find .open-next -maxdepth 3 -name '*worker*.js' | head -n 1 || true)"
          fi
          if [ -n "$WORKER_SRC" ] && [ -f "$WORKER_SRC" ]; then
            cp "$WORKER_SRC" .open-next/_worker.js
          else
            echo "OpenNext 워커 산출물이 없습니다. .open-next 내용을 확인하세요:"
            ls -la .open-next || true
            exit 1
          fi
          cp _routes.json .open-next/_routes.json
          # 정적 산출물을 최상위에 병합하여 Pages가 /_next/* 경로를 바로 서빙하도록 정리
          if [ -d .open-next/static ]; then
            rsync -a .open-next/static/ .open-next/
          fi

      # 배포 산출물에 필수 파일이 모두 존재하는지 확인
      - name: Verify OpenNext artifacts
        run: |
          test -f .open-next/_worker.js
          test -f .open-next/_routes.json
          # _next 자산 위치 보정
          if [ ! -d .open-next/_next ]; then
            NEXT_SRC="$(find .open-next -maxdepth 4 -type d -name '_next' | head -n 1 || true)"
            if [ -n "$NEXT_SRC" ] && [ -d "$NEXT_SRC" ] && [ "$NEXT_SRC" != ".open-next/_next" ]; then
              rsync -a "$NEXT_SRC"/ .open-next/_next/
            fi
          fi
          if [ ! -d .open-next/_next ]; then
            echo "_next 정적 자산을 찾을 수 없습니다. .open-next 내용을 확인하세요:"
            ls -la .open-next || true
            find .open-next -maxdepth 3 -type d -name "_next" || true
            exit 1
          fi

      # Cloudflare Pages로 결과물 전송 (배포)
      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: pbr # Cloudflare에 만들어둔 프로젝트 이름 (로그에 'pbr'로 확인됨)
          directory: .open-next # OpenNext의 빌드 결과물 경로(정적 파일 및 워커 포함)
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: codex/17-28-42 # 배포될 브랜치 명시
          wranglerVersion: '3'
