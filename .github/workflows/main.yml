name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["codex/12-58-08"] # 작업 중인 브랜치 이름 확인!
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node.js 설정 (메모리 넉넉한 환경)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 의존성 설치
      - name: Install Dependencies
        run: npm install

      # 빌드 실행 (GitHub 서버의 7GB 램을 사용하므로 OOM 걱정 없음)
      - name: Build Next.js App
        run: npm run build:cf
        env:
          # 리눅스 환경에 맞는 메모리 옵션 설정
          NODE_OPTIONS: "--max_old_space_size=6144"

      # 배포 디렉터리(.open-next/static)에 Pages가 기대하는 워커/라우트 파일을 배치
      - name: Prepare Pages publish directory
        run: |
          mkdir -p .open-next/static
          if [ -f .open-next/worker.js ] && [ ! -f .open-next/_worker.js ]; then
            cp .open-next/worker.js .open-next/_worker.js
          fi
          cp .open-next/_worker.js .open-next/static/
          cp _routes.json .open-next/_routes.json
          cp _routes.json .open-next/static/_routes.json

      # 배포 산출물에 필수 파일이 모두 존재하는지 확인
      - name: Verify OpenNext artifacts
        run: |
          test -f .open-next/static/_worker.js
          test -f .open-next/static/_routes.json

      # Cloudflare Pages로 결과물 전송 (배포)
      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: pbr # Cloudflare에 만들어둔 프로젝트 이름 (로그에 'pbr'로 확인됨)
          directory: .open-next/static # OpenNext의 빌드 결과물 경로(정적 파일 및 워커 포함)
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: codex/12-58-08 # 배포될 브랜치 명시
          wranglerVersion: '3'
